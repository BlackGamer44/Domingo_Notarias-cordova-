<html lang="es">

    connect-src 'self' https://*.trycloudflare.com;
    ">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Gestión de Usuarios</title>

    <!-- Tus estilos -->
    <link rel="stylesheet" href="css/dashboard-premium.css">
    <link rel="stylesheet" href="css/app-shell.css">
    <link rel="stylesheet" href="css/app-pages.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/gestion_usuarios.css">

<body class="app-shell demo-cordova">

<div class="layout">

<main class="main-content">

<header class="topbar">

    <div class="topbar-left">
        <h2>Gestión de usuarios</h2>
    </div>

    <div class="topbar-right">

        <div class="user-box">

            <div class="avatar">
                <i class="fa-solid fa-user"></i>
            </div>

            <div>
                <strong>admin.demo</strong>
                <small>Administrador</small>
            </div>

        </div>

    </div>

</header>

<div class="page-content">

<div class="page-gestion-usuarios container">

    <!-- FORMULARIO -->
    <h3>Nuevo usuario</h3>

    <form class="gestion-form"  id="form-usuario"  method="post">

        <div class="form-group" id="form-group-nombre">

            <label for="nombre"> Nombre completo  </label>

            <input type="text" id="nombre" name="nombre"  required>

        </div>

        <div class="form-group" id="form-group-usuario">
            <label for="username"> Usuario </label>
            <input type="text"  id="username"  name="username" required>
        </div>

        <div class="form-group" id="form-group-correo">
            <label for="email"> Correo </label>
            <input type="email"  id="email" name="email" required>
        </div>

        <div class="form-group password-field" id="form-group-password">
            <label for="password">  Contraseña </label>
            <input type="password" id="password" name="password" required>
            <span class="password-toggle">👁</span>
        </div>

        <div class="form-group" id="form-group-rol">

            <label for="rol"> Rol   </label>

            <select id="rol" name="rol">
                <option value="consulta">Consulta
                </option>

                <option value="capturista" selected>
                    Capturista
                </option>

                <option value="admin">
                    Administrador
                </option>

            </select>

        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary">

                Crear usuario

            </button>

        </div>

    </form>

    <!-- TABLA -->
    <h3>Usuarios registrados</h3>

    <table>

        <thead>

            <tr>

                <th>Nombre</th>
                <th>Usuario</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Registrado</th>

            </tr>

        </thead>

        <tbody id="tabla-usuarios">

        </tbody>

    </table>

</div>

</div>

</main>

</div>

<!-- MENU -->
<nav class="demo-bottom-nav">

    <a href="index.html">
        <i class="fa-solid fa-house"></i>
        Inicio

    <a href="usuarios.html" class="is-active">

    <a href="reportes.html">
        <i class="fa-solid fa-chart-bar"></i>
        Reportes
    </a>

</nav>

<!-- Cordova -->
<script src="cordova.js"></script>
<!-- Configuración -->
<script src="js/config.js"></script>
<!-- jQuery -->
<script src="js/jquery.min.js"></script>

<script>

    // URL DE TU API
    const API_URL = TUNEL_URL + "/proyectos/api/usuarios.php";

    // ESPERAR A CORDOVA
    document.addEventListener(
        "deviceready",
        onDeviceReady,
        false
    );

    // PARA PRUEBAS EN NAVEGADOR
    // $(document).ready(onDeviceReady);

    // =========================================
    // INICIO
    // =========================================

    function onDeviceReady() {

        console.log("Cordova listo");

        cargarUsuarios();

        iniciarFormulario();

        iniciarPasswordToggle();

    }

    // =========================================
    // FORMULARIO
    // =========================================

    function iniciarFormulario() {

        $("#form-usuario").on("submit", function(e) {

            e.preventDefault();

            const datosUsuario = {

                nombre: $("#nombre").val(),

                username: $("#username").val(),

                email: $("#email").val(),

                password: $("#password").val(),

                rol: $("#rol").val(),

                estado: "Activo"

            };

            guardarUsuario(datosUsuario);

        });

    }

    // =========================================
    // GUARDAR USUARIO
    // =========================================

    function guardarUsuario(datosUsuario) {

        $.ajax({

            url: API_URL,

            type: "POST",

            dataType: "json",

            contentType: "application/json",

            data: JSON.stringify(datosUsuario),

            success: function(response) {

                alert("Usuario creado correctamente");

                $("#form-usuario")[0].reset();

                cargarUsuarios();

            },

            error: function(xhr, status, error) {

                console.error(error);

                alert("Error al guardar usuario");

            }

        });

    }

    // =========================================
    // CARGAR USUARIOS
    // =========================================

    function cargarUsuarios() {

        const $tabla = $("#tabla-usuarios");

        $tabla.html(`
            <tr>
                <td colspan="6" style="text-align:center;">
                    Cargando usuarios...
                </td>
            </tr>
        `);

        $.ajax({

            url: API_URL,

            type: "GET",

            dataType: "json",

            success: function(usuarios) {

                let html = "";

                if (usuarios.length === 0) {

                    html = `
                        <tr>
                            <td colspan="6" style="text-align:center;">
                                No hay usuarios registrados
                            </td>
                        </tr>
                    `;

                    $tabla.html(html);

                    return;
                }

                usuarios.forEach(function(usuario) {

                    html += `

                        <tr>

                            <td data-label="Nombre">
                                ${usuario.nombre}
                            </td>

                            <td data-label="Usuario">

                                <code>
                                    ${usuario.username}
                                </code>

                            </td>

                            <td data-label="Correo">

                                ${usuario.email || '—'}

                            </td>

                            <td data-label="Rol">

                                <span class="role-badge role-${usuario.rol}">

                                    ${usuario.rol}

                                </span>

                            </td>

                            <td data-label="Estado">

                                <span class="
                                    ${usuario.estado === 'Activo'
                                        ? 'status-active'
                                        : 'status-inactive'}
                                ">

                                    ${usuario.estado}

                                </span>

                            </td>

                            <td data-label="Registrado">

                                ${usuario.fecha_registro || '—'}

                            </td>

                        </tr>

                    `;

                });

                $tabla.html(html);

            },

            error: function(xhr, status, error) {

                console.error(error);

                $tabla.html(`

                    <tr>

                        <td colspan="6"
                        style="text-align:center;color:red;">

                            Error al conectar con el servidor

                        </td>

                    </tr>

                `);

            }

        });

    }

    // =========================================
    // VER / OCULTAR PASSWORD
    // =========================================

    function iniciarPasswordToggle() {

        $(".password-toggle").on("click", function() {

            const input = $("#password");

            if (input.attr("type") === "password") {

                input.attr("type", "text");

                $(this).text("🙈");

            } else {

                input.attr("type", "password");

                $(this).text("👁");

            }

        });

    }

</script>

</body>
</html>
